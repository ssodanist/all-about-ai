<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=Noto+Sans+KR:wght@300;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0b1320}
  .cover{position:relative;width:1520px;height:2250px;overflow:hidden;
    background:radial-gradient(ellipse 70% 55% at 50% 72%, #1d2c44 0%, #111c2d 45%, #0a111c 100%);
    font-family:'Noto Serif KR',serif;color:#efe9dc}
  .doc{position:absolute;inset:0;padding:120px 110px;font-family:'Noto Sans KR',sans-serif;font-weight:300;
    font-size:23px;line-height:1.95;color:rgba(239,233,220,.055);letter-spacing:.02em;text-align:justify;word-break:keep-all}
  svg{position:absolute;inset:0}
  .kicker{position:absolute;top:190px;width:100%;text-align:center;font-family:'Noto Sans KR';font-weight:500;
    font-size:30px;letter-spacing:.9em;color:#c9b88f;text-indent:.9em}
  .title{position:absolute;top:255px;width:100%;text-align:center;font-weight:900;font-size:300px;line-height:1;
    letter-spacing:.04em;color:#f4efe4;text-shadow:0 8px 40px rgba(0,0,0,.45)}
  .sub{position:absolute;top:610px;width:100%;text-align:center;font-weight:600;font-size:46px;letter-spacing:.06em;color:#e6dcc6}
  .annex{position:absolute;top:700px;width:100%;text-align:center;font-family:'Noto Sans KR';font-weight:300;
    font-size:24px;letter-spacing:.55em;color:#8f9bb0;text-indent:.55em}
  .tag{position:absolute;bottom:330px;width:100%;text-align:center;font-weight:400;font-size:38px;line-height:1.75;color:#e9dfc8}
  .tag b{font-weight:600;color:#f3d48a}
  .author{position:absolute;bottom:150px;width:100%;text-align:center;font-weight:600;font-size:44px;letter-spacing:.2em;color:#f4efe4}
  .rule{position:absolute;bottom:250px;left:50%;width:120px;margin-left:-60px;border-top:2px solid #c9b88f;opacity:.7}
  .stamp{position:absolute;top:1060px;right:150px;transform:rotate(-9deg);border:7px solid rgba(178,40,36,.82);
    padding:10px 26px 14px;font-weight:900;font-size:64px;letter-spacing:.12em;color:rgba(178,40,36,.82);
    border-radius:6px;mix-blend-mode:screen}
  .stamp small{display:block;font-family:'Noto Sans KR';font-weight:500;font-size:22px;letter-spacing:.3em;text-align:center;margin-top:2px}
</style></head><body>
<div class="cover">
  <div class="doc" id="doc"></div>
  <svg width="1520" height="2250" viewBox="0 0 1520 2250">
    <defs>
      <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe9b0" stop-opacity=".95"/>
        <stop offset=".55" stop-color="#e9b85c" stop-opacity=".55"/>
        <stop offset="1" stop-color="#e9b85c" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="slit" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff3cf" stop-opacity="0"/>
        <stop offset=".5" stop-color="#fff6dc" stop-opacity="1"/>
        <stop offset="1" stop-color="#fff3cf" stop-opacity="0"/>
      </linearGradient>
      <filter id="glow" x="-200%" y="-20%" width="500%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
      <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    </defs>
    <!-- door frame -->
    <rect x="560" y="860" width="400" height="760" fill="#070c14" stroke="#2a3a55" stroke-width="3"/>
    <!-- door panel slightly ajar -->
    <polygon points="560,860 905,885 905,1595 560,1620" fill="#0d1624" stroke="#24324a" stroke-width="2"/>
    <rect x="610" y="930" width="240" height="250" fill="none" stroke="#1d2a40" stroke-width="3" transform="skewY(2)"/>
    <rect x="610" y="1260" width="240" height="280" fill="none" stroke="#1d2a40" stroke-width="3" transform="skewY(2)"/>
    <circle cx="880" cy="1250" r="9" fill="#5e6b80"/>
    <!-- light through the gap -->
    <rect x="905" y="862" width="55" height="756" fill="url(#slit)" filter="url(#glow)" opacity=".9"/>
    <rect x="918" y="864" width="30" height="752" fill="#fff4d6"/>
    <!-- light cast on the floor -->
    <polygon points="905,1620 960,1620 1340,2250 760,2250" fill="url(#beam)" opacity=".55" filter="url(#soft)"/>
    <!-- floor line -->
    <line x1="0" y1="1620" x2="1520" y2="1620" stroke="#22314a" stroke-width="2" opacity=".8"/>
    <!-- teacup in the light -->
    <g transform="translate(965,1735)" fill="#0b1320" opacity=".92">
      <ellipse cx="0" cy="44" rx="74" ry="12"/>
      <path d="M-48,-6 L48,-6 Q44,40 0,42 Q-44,40 -48,-6 Z"/>
      <path d="M47,4 q32,2 22,24 q-8,12 -26,6" fill="none" stroke="#0b1320" stroke-width="9"/>
      <path d="M-14,-24 q-10,-16 4,-30 M10,-22 q-10,-18 6,-34" fill="none" stroke="#0b1320" stroke-width="5" opacity=".55"/>
    </g>
  </svg>
  <div class="kicker">장편소설</div>
  <div class="title">제7조</div>
  <div class="sub">2027·2028, 한반도를 둘러싼 네 개의 방</div>
  <div class="annex">ANNEX C · ARTICLE 7</div>
  <div class="stamp">通告<small>NOTIFY ONLY</small></div>
  <div class="tag">1905년, 그 방에 조선인은 없었다.<br><b>2027년, 이번에는 우리가 있었다.</b></div>
  <div class="rule"></div>
  <div class="author">[저자명]</div>
</div>
<script>
const t="제7조 (역내 비상사태 시의 운용) ① 역내 비상사태가 발생한 경우, 본 양해각서에 따라 건조·정비·개조되는 함정 및 관련 조선 시설의 운용 우선권은 합동 조정위원회의 결정에 따른다. ② 제1항의 비상사태 여부는 합동 조정위원회 의장이 판단한다. ③ 제1항의 결정은 양국 정부에 즉시 통보되며, 통보 즉시 효력을 갖는다. タフト氏曰ク 韓國ニ對シテハ 其同意ヲ要セス 通告スルニ止メテ可ナリ 光武九年 七月 二十九日 東京 臣韓敬鎭 親耳而記 ";
document.getElementById('doc').textContent=t.repeat(14);
</script>
</body></html>
